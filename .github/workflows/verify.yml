name: Verify

# Runs the one-command driver verify_all.sh on every push and PR.
# Reproduces every paper claim end-to-end (~5 minutes per Python version).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The provenance gate compares HEAD against the recorded content
          # commit; a shallow clone lacks that object and fails the gate.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run verify_all.sh
        run: bash verify_all.sh
